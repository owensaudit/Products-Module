<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ministering Visit Portal</title>
    <link rel="stylesheet" href="/styles.css?v=5">
  </head>
  <body>
    <a class="skip" href="#app">Skip to the portal</a>
    <div class="church-bar">
      <div class="church-brand">
        <svg class="church-mark" viewBox="0 0 40 56" aria-hidden="true">
          <path d="M7 52 V26 A13 13 0 0 1 33 26 V52" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M4 52 H36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <p class="church-name">
          <span>The Church of</span>
          <strong>Jesus Christ</strong>
          <span>of Latter-day Saints</span>
        </p>
      </div>
    </div>
    <header class="site-header">
      <div class="title-block">
        <p class="eyebrow">Elders Quorum</p>
        <h1>Ministering visits</h1>
        <p class="lede">Find a brother by name, then filter by status or priesthood.</p>
      </div>
      <aside id="presidency" aria-label="EQ Presidency"></aside>
    </header>
    <p id="notice" class="notice" role="status" hidden></p>
    <main id="app" tabindex="-1"></main>
    <script src="/app.js?v=5" type="module"></script>
  </body>
</html>
